[package]
name = "zest"
version = "0.1.0"
edition = "2024"
description = "Gardner minichess engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/niwatoriiiiiiiii/zest"
readme = "README.md"

[[bin]]
name = "zest"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
pedantic = "warn"
nursery = "warn"
