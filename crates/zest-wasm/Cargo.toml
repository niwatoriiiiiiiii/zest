[package]
name = "zest-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for the Zest Gardner minichess engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/niwatoriiiiiiiii/zest"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zest = { path = "../.." }
wasm-bindgen = "0.2.130"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
